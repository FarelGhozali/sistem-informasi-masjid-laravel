# Production stack: nginx (Astro build + /api proxy on one origin), PHP-FPM
# (Laravel), PostgreSQL. Kept separate from compose.yaml, which is the Sail
# development stack.
#
#   docker compose -f compose.production.yaml up -d --build
#
# The `web` service is published directly on the host at
# http://localhost:${WEB_PORT:-8081} (override WEB_PORT to change it), so the
# stack can be debugged without Traefik. The Traefik labels and external
# `proxy` network are kept below but commented out; uncomment them when the
# stack is ready to sit behind the existing proxy again.
#
# Overridable via the environment or a .env file next to this file:
# WEB_PORT, APP_DOMAIN, SITE_URL, APP_URL, PUBLIC_API_BASE_URL, DB_DATABASE,
# DB_USERNAME, DB_PASSWORD, SEED_DEMO_DATA.
#
# For local testing, set APP_URL to the published origin (for example
# APP_URL=http://localhost:8081) so generated storage/poster URLs include the
# host port. A domain URL is still required for production deployments.
name: masjid

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-masjid}
      POSTGRES_USER: ${DB_USERNAME:-masjid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-masjid} -d ${DB_DATABASE:-masjid}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/production/app/Dockerfile
    environment:
      APP_NAME: "Sistem Informasi Masjid"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://masjid.farelghozali.my.id}
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: id
      APP_FAKER_LOCALE: id_ID
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-masjid}
      DB_USERNAME: ${DB_USERNAME:-masjid}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/production/web/Dockerfile
      args:
        SITE: ${SITE_URL:-http://masjid.farelghozali.my.id}
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
    ports:
      - "${WEB_PORT:-8081}:80"
    volumes:
      # Read-only: nginx serves uploaded posters from here, PHP-FPM writes.
      - app-storage:/var/www/html/storage:ro
    # Uncomment to put this service behind the existing Traefik again.
    # networks:
    #   - default
    #   - proxy
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=proxy"
    #   - "traefik.http.routers.masjid.rule=Host(`masjid.home`)"
    #   - "traefik.http.routers.masjid.entrypoints=web"
    #   - "traefik.http.routers.masjid.service=masjid"
    #
    #   - "traefik.http.routers.masjid-https.rule=Host(`masjid.home`)"
    #   - "traefik.http.routers.masjid-https.entrypoints=websecure"
    #   - "traefik.http.routers.masjid-https.tls=true"
    #   - "traefik.http.routers.masjid-https.service=masjid"
    #
    #   #cloudflare tunnel
    #   - "traefik.http.routers.masjid-ct.rule=Host(`masjid.farelghozali.my.id`)"
    #   - "traefik.http.routers.masjid-ct.entrypoints=web"
    #   - "traefik.http.routers.masjid-ct.service=masjid"
    #
    #   - "traefik.http.services.masjid.loadbalancer.server.port=80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data:
  app-storage:

# Uncomment together with the `web.networks` block above when using Traefik.
# networks:
#   proxy:
#     external: true
#     name: proxy
