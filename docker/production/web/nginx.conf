server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Filament publishes its CSS/JS into Laravel's public directory. The web
    # image copies them into this nginx root at build time.
    location ^~ /css/filament/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /js/filament/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded posters and other public storage files. The app's storage volume
    # is mounted read-only in this container (see compose.production.yaml).
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        add_header Cache-Control "public, max-age=604800";
    }

    # The Astro site and the Laravel API share one origin: no CORS, one
    # certificate, one domain. Static files come from the built site; /api/
    # is handed to PHP-FPM in the app container.
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO "";
        fastcgi_pass app:9000;
    }

    # Filament panels, Livewire endpoints and Laravel's health route are
    # Laravel routes too, so they use the same PHP-FPM handoff as /api/.
    location ~ ^/(admin|bendahara|takmir|livewire|sanctum|up)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO "";
        fastcgi_pass app:9000;
    }

    # Event detail pages generated at build time are served as files. Any
    # other slug falls back to the client-rendered detail page, so new events
    # work without a rebuild and missing pages never return 404.
    location /jadwal/ {
        try_files $uri $uri/index.html $uri.html /jadwal/detail/index.html;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
